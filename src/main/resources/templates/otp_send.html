<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login OTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 30px;
        }
        h2 {
            color: #333333;
            text-align: center;
        }
        p {
            color: #555555;
            font-size: 14px;
            line-height: 1.6;
        }
        .otp-box {
            display: inline-block;
            margin: 20px 0;
            padding: 12px 24px;
            background-color: #0073e6;
            color: #ffffff !important;
            border-radius: 4px;
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 6px;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999999;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Login OTP</h2>
    <p>Dear <strong th:text="${username}">User</strong>,</p>
    <p>Use the following One-Time Password (OTP) to log in securely:</p>

    <div class="otp-box" th:text="${otp}">123456</div>

    <p>This OTP will expire in <strong th:text="${expiryMinutes}">10</strong> minutes and can be used only once.</p>
    <p>If you didn’t request this login, please ignore and delete this message.</p>

    <div class="footer">
        &copy; 2026 Your Company. All rights reserved.
    </div>
</div>
</body>
</html>
